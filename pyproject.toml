[project]
name = "bustrust"
version = "0.1.0"
description = "Dublin bus reliability predictor: honest arrival ranges and no-show risk for every bus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bustrust = "common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ingest", "pipeline", "ml", "api"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["notebooks/", "web/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
